Plot.bar=barChart;

/* ---------- 绘图:矩阵热力图 ---------- */
function drawMatrix(cv, o){
  const data=o.data, rows=data.length, cols=data[0].length;
  const gap=o.gap!=null?o.gap:2;
  const cell=o.cell||Math.max(14, Math.min(46, (o.width||340)/cols));
  const padLabel=(o.rowLabels||o.colLabels)?(o.labelSize||16):0;
  const W=cols*cell+(cols+1)*gap+((o.rowLabels)?46:0);
  const H=rows*cell+(rows+1)*gap+((o.colLabels)?24:0);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  cv.style.width=W+'px'; cv.style.maxWidth='100%'; cv.style.height='auto';
  const ctx=cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const lo=token(o.lo||'--seq-lo','#eaf2fc'), mid=token(o.mid||'--seq-mid','#6da7ec'), hi=token(o.hi||'--seq-hi','#0d366b');
  const min=o.min!=null?o.min:Math.min.apply(null,data.flat());
  const max=o.max!=null?o.max:Math.max.apply(null,data.flat());
  const offX=o.rowLabels?46:gap;
  const offY=o.colLabels?24:gap;
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const v=data[r][c];
    let t=(v-min)/((max-min)||1); t=clamp(t,0,1);
    const col = o.diverging ? (t<0.5? mix(lo,mid,t*2) : mix(mid,hi,(t-0.5)*2)) : mix(lo,hi,t);
    const x=offX+c*(cell+gap), y=offY+r*(cell+gap);
    ctx.fillStyle=rgba(col,1); roundRect(ctx,x,y,cell,cell,2); ctx.fill();
    if(o.showVals && cell>=24){
      ctx.fillStyle = t>0.55 ? '#fff' : token('--ink','#111');
      ctx.font='10px "JetBrains Mono", monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(fmt(v,1), x+cell/2, y+cell/2);
    }
  }
  ctx.fillStyle=token('--muted','#777'); ctx.font='10px "JetBrains Mono", monospace';

    ctx.textAlign='center'; ctx.textBaseline='top';

}

/* ---------- 绘图:网络结构 ---------- */
function drawNet(cv, o){

  const {ctx,w}=fitCanvas(cv,H);
  const padX=34, padY=22;
  const L=sizes.length;
  const pos=sizes.map((n,li)=>{
    const x=padX+li*(w-2*padX)/(Math.max(1,L-1));
    return Array.from({length:n},(_,i)=>({
      x, y:padY+(i+0.5)*(H-2*padY)/n

  });

  const lineC=token('--line2','#aaa');
  // 连线
  for(let li=0;li<L-1;li++){
    pos[li].forEach((a,i)=>{
      pos[li+1].forEach((b,j)=>{
        let wv=1;
        if(o.weights&&o.weights[li]) wv=o.weights[li][j][i];
        const a2=o.showWeights? clamp(Math.abs(wv)*0.9,0.06,0.9) : (o.showWeights===false?0.10:0.16);
        ctx.strokeStyle = o.showWeights ? (wv>=0?accent:accent2) : lineC;
        ctx.globalAlpha = a2;
        ctx.lineWidth = o.showWeights ? clamp(Math.abs(wv)*2.2,0.5,3.4) : 1;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        ctx.globalAlpha=1;
      });
    });
  }
  // 节点
  const r=o.r||11;
  pos.forEach((layer,li)=>{
    layer.forEach((p,i)=>{
      let fill=token('--surface','#fff'), stroke=token('--ink2','#456');
      if(o.activations&&o.activations[li]){
        const v=o.activations[li][i];
        const t=clamp((v+1)/2,0,1);
        fill=rgba(mix(token('--surface2','#eee'), token('--accent','#1F4FD1'), t*0.85),1);
      }
      if(o.highlight && o.highlight[0]===li && o.highlight[1]===i){ stroke=token('--accent2','#C24A16'); }
      ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU);
      ctx.fillStyle=fill; ctx.fill();
      ctx.lineWidth=(o.highlight&&o.highlight[0]===li&&o.highlight[1]===i)?3:1.6;
      ctx.strokeStyle=stroke; ctx.stroke();
    });
  });
  if(o.labels){
    ctx.fillStyle=token('--muted','#777'); ctx.font='10px "Noto Sans SC", sans-serif';
    ctx.textAlign='center';
    if(o.labels.input) o.labels.input.forEach((t,i)=>{ if(pos[0][i]) ctx.fillText(t,pos[0][i].x,pos[0][i].y+r+13); });
  }
  return {pos};
}

/* ---------- 微型神经网络 ---------- */
const ACTS={
  relu:{ f:z=>z>0?z:0, d:(z,a)=>z>0?1:0 },
  leaky:{ f:z=>z>0?z:0.01*z, d:z=>z>0?1:0.01 },

  sigmoid:{ f:z=>1/(1+Math.exp(-z)), d:(z,a)=>a*(1-a) },

  let m=-Infinity; for(let i=0;i<z.length;i++) if(z[i]>m) m=z[i];
  const out=new Float64Array(z.length); let s=0;
  for(let i=0;i<z.length;i++){ out[i]=Math.exp(z[i]-m); s+=out[i]; }

class MLP{

  forward(x){
    const acts=[x], zs=[];
    let a=x;
    for(let l=0;l<this.L;l++){
      const nIn=this.sizes[l], nOut=this.sizes[l+1];
      const z=new Float64Array(nOut);
      const W=this.W[l], b=this.b[l];
      for(let j=0;j<nOut;j++){
        let s=b[j]; const off=j*nIn;
        for(let i=0;i<nIn;i++) s+=W[off+i]*a[i];
        z[j]=s;
      }
      zs.push(z);
      if(l===this.L-1) a=(this.out==='softmax')?softmax(z):z.slice();
      else { const A=ACTS[this.act]||ACTS.relu; const na=new Float64Array(nOut); for(let j=0;j<nOut;j++) na[j]=A.f(z[j]); a=na; }
      acts.push(a);
    }
    return {acts,zs};
  }
  predict(x){
    const r=this.forward(x), y=r.acts[this.L];
    if(this.out==='softmax'){ let bi=0; for(let i=1;i<y.length;i++) if(y[i]>y[bi]) bi=i; return bi; }
    return y.length?y[0]:0;
  }
  probs(x){
    const r=this.forward(x), y=r.acts[this.L];
    if(this.out==='softmax') return Array.from(y);
    return [1-y[0], y[0]];
  }
  zeroGrad(){ for(let l=0;l<this.L;l++){ this.dW[l].fill(0); this.db[l].fill(0); } }
  backward(x,y){
    const {acts,zs}=this.forward(x);
    const last=acts[this.L];
    let delta=new Float64Array(last.length);
    if(this.out==='softmax'){
      for(let j=0;j<last.length;j++){
        const t=(typeof y==='number')?(j===y?1:0):y[j];
        delta[j]=last[j]-t;
      }
    } else {
      for(let j=0;j<last.length;j++){
        const t=(typeof y==='number')?y:y[j];
        delta[j]=last[j]-t;
      }
    }
    for(let l=this.L-1;l>=0;l--){
      const nIn=this.sizes[l], nOut=this.sizes[l+1];
      const aPrev=acts[l];
      for(let j=0;j<nOut;j++){
        const d=delta[j];
        if(d===0) continue;
        const off=j*nIn;
        for(let i=0;i<nIn;i++) this.dW[l][off+i]+=d*aPrev[i];
        this.db[l][j]+=d;
      }
      if(l>0){
        const prev=new Float64Array(nIn);
        const A=ACTS[this.act]||ACTS.relu;
        for(let i=0;i<nIn;i++){
          let s=0;
          for(let j=0;j<nOut;j++) s+=this.W[l][j*nIn+i]*delta[j];
          const zprev=zs[l-1][i];
          prev[i]=s*A.d(zprev, aPrev[i]);
        }
        delta=prev;
      }
    }
  }
  step(batch, lr, o){
    o=o||{};
    const opt=o.opt||'sgd';
    const n=batch.length||1;
    this.zeroGrad();
    for(let k=0;k<batch.length;k++) this.backward(batch[k].x, batch[k].y);
    if(!this._opt||this._opt.type!==opt){
      const v=[], m=[];
      for(let l=0;l<this.L;l++){ v.push(new Float64Array(this.W[l].length), new Float64Array(this.b[l].length)); m.push(new Float64Array(this.W[l].length), new Float64Array(this.b[l].length)); }
      this._opt={type:opt,t:0,v,m};
    }
    const st=this._opt;
    if(opt==='adam') st.t++;
    const mu=o.momentum==null?0.9:o.momentum;
    for(let l=0;l<this.L;l++){
      apply(this.W[l], this.dW[l], st.v[2*l], st.m[2*l], l);
      apply(this.b[l], this.db[l], st.v[2*l+1], st.m[2*l+1], l+0.5);
    }
    function apply(P,G,V,M,idx){
      for(let i=0;i<P.length;i++){
        const g=G[i]/n;
        if(opt==='adam'){
          M[i]=0.9*M[i]+0.1*g;
          V[i]=0.999*V[i]+0.001*g*g;
          const mh=M[i]/(1-Math.pow(0.9,st.t));
          const vh=V[i]/(1-Math.pow(0.999,st.t));
          P[i]-=lr*mh/(Math.sqrt(vh)+1e-8);
        } else if(opt==='momentum'){
          V[i]=mu*V[i]-lr*g;
          P[i]+=V[i];
        } else {
          P[i]-=lr*g;
        }
      }
    }
  }
  clone(){
    const c=new MLP(this.sizes,{act:this.act,out:this.out,seed:7});
    for(let l=0;l<this.L;l++){ c.W[l].set(this.W[l]); c.b[l].set(this.b[l]); }
    return c;
  }
  accuracy(data){
    let ok=0;
    for(let i=0;i<data.length;i++) if(this.predict(data[i].x)===data[i].y) ok++;
    return ok/Math.max(1,data.length);
  }
  loss(data){
    let s=0;
    for(let i=0;i<data.length;i++) s+=sampleLoss(this,data[i]);
    return s/Math.max(1,data.length);
  }
}
function sampleLoss(net, s){
  const r=net.forward(s.x), y=r.acts[net.L];
  if(net.out==='softmax'){
    const p=clamp(y[s.y],1e-12,1);
    return -Math.log(p);
  }
  const t=(typeof s.y==='number')?s.y:s.y[0];
  return 0.5*(y[0]-t)*(y[0]-t);
}
function shuffle(a,rng){
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

/* ---------- 数据集 ---------- */
const Data={
  split(points, ratio, seed){
    const rng=mulberry32(seed||9);
    const arr=points.slice(); shuffle(arr,rng);
    const cut=Math.floor(arr.length*(ratio==null?0.8:ratio));
    return {train:arr.slice(0,cut), test:arr.slice(cut)};
  },
  bounds(points, pad){
    let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
    points.forEach(p=>{ x0=Math.min(x0,p.x[0]); x1=Math.max(x1,p.x[0]); y0=Math.min(y0,p.x[1]); y1=Math.max(y1,p.x[1]); });
    const p=pad==null?0.25:pad;
    return [[x0-p,x1+p],[y0-p,y1+p]];
  },
  blobs(n, k, seed){
    const rng=mulberry32(seed||3), pts=[];
    k=k||3;
    for(let c=0;c<k;c++){
      const ang=TAU*c/k - 0.4, R=1.25;
      const cx=Math.cos(ang)*R, cy=Math.sin(ang)*R;
      for(let i=0;i<n/k;i++) pts.push({x:[cx+randn(rng)*0.24, cy+randn(rng)*0.24], y:c});
    }
    return pts;
  },
  moons(n, seed){
    const rng=mulberry32(seed||5), pts=[];
    n=n||160;
    for(let i=0;i<n;i++){
      const t=Math.PI*(i/(n-1));
      if(i%2===0) pts.push({x:[Math.cos(t), Math.sin(t)]});
      else pts.push({x:[1-Math.cos(t), 0.5-Math.sin(t)]});
    }
    pts.forEach((p,i)=>{ p.x=[p.x[0]+randn(rng)*0.09,p.x[1]+randn(rng)*0.09]; p.y=i%2; });
    return pts;
  },
  circle(n, seed){
    const rng=mulberry32(seed||11), pts=[];
    n=n||200;
    for(let i=0;i<n;i++){
      const c=i%2===0?0:1;
      const r=c===0?0.55+randn(rng)*0.07:1.3+randn(rng)*0.08;
      const a=rng()*TAU;
      pts.push({x:[Math.cos(a)*r, Math.sin(a)*r], y:c});
    }
    return pts;
  },
  xor(n, seed){
    const rng=mulberry32(seed||13), pts=[];
    n=n||200;
    for(let i=0;i<n;i++){
      const qx=rng()<0.5?-1:1, qy=rng()<0.5?-1:1;
      const y=(qx*qy>0)?0:1;
      pts.push({x:[qx*(0.6+Math.abs(randn(rng))*0.3), qy*(0.6+Math.abs(randn(rng))*0.3)], y});
    }
    return pts;
  },
  spiral(n, k, seed){
    const rng=mulberry32(seed||17), pts=[];
    n=n||240; k=k||3;
    for(let i=0;i<n;i++){
      const c=i%k, t=(i/n)*3.6*Math.PI + c*TAU/k;
      const r=0.15+ (i/n)*1.8;
      pts.push({x:[Math.cos(t)*r+randn(rng)*0.055, Math.sin(t)*r+randn(rng)*0.055], y:c});
    }
    return pts;
  }
};
window.Data=Data;

/* ---------- 决策边界 ---------- */
function renderBoundary(cv, net, o){
  o=o||{};
  const {ctx,w,h}=fitCanvas(cv, o.height||320);
  const bounds=o.bounds||[[-2,2],[-2,2]];
  const [[x0,x1],[y0,y1]]=bounds;
  const res=o.res||44;
  const off=document.createElement('canvas'); off.width=res; off.height=res;
  const octx=off.getContext('2d');
  const img=octx.createImageData(res,res);
  const palette=o.colors||[token('--c1','#2a78d6'),token('--c2','#eb6834'),token('--c3','#1baf7a'),token('--c4','#eda100')];
  const k=net.out==='softmax'?net.sizes[net.L]:2;
  for(let j=0;j<res;j++){
    for(let i=0;i<res;i++){
      const x=x0+(i+0.5)/res*(x1-x0);
      const y=y1-(j+0.5)/res*(y1-y0);
      let pr;
      if(net.out==='softmax'){
        const r=net.forward([x,y]);
        pr=Array.from(r.acts[net.L]);
      } else {
        const v=net.forward([x,y]).acts[net.L][0];
        const p=1/(1+Math.exp(-v)); pr=[1-p,p];
      }
      let bi=0; for(let t=1;t<pr.length;t++) if(pr[t]>pr[bi]) bi=t;
      const conf=pr[bi];
      const col=hexToRgb(palette[bi%palette.length]);
      const alpha=o.soft? clamp((conf-1/pr.length)/(1-1/pr.length),0,1)*0.75+0.06 : 0.5;
      const idx=(j*res+i)*4;
      img.data[idx]=col[0]; img.data[idx+1]=col[1]; img.data[idx+2]=col[2];
      img.data[idx+3]=Math.round(alpha*255);
    }
  }
  octx.putImageData(img,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(off,0,0,w,h);
  // 数据点
  const pts=o.points||[];
  pts.forEach(p=>{
    const px=(p.x[0]-x0)/(x1-x0)*w;
    const py=h-(p.x[1]-y0)/(y1-y0)*h;
    const col=hexToRgb(palette[p.y%palette.length]);
    ctx.beginPath(); ctx.arc(px,py,3.4,0,TAU);
    ctx.fillStyle=rgba(col,1); ctx.fill();
    ctx.strokeStyle=o.ring||token('--surface','#fff'); ctx.lineWidth=1.2; ctx.stroke();
  });
  return {ctx,w,h};
}
window.renderBoundary=renderBoundary;

/* ---------- 计时器 ---------- */
function createTicker(node, fn){
  let raf=null, running=false, stopFlag=false;
  function loop(t){
    if(stopFlag) return;
    raf=requestAnimationFrame(loop);
    if(document.hidden) return;
    if(node && node.offsetParent===null) return;
    try{ fn(t); }catch(e){ console.error(e); stopFlag=true; }
  }
  return {
    start(){ if(running) return; running=true; raf=requestAnimationFrame(loop); },
    stop(){ running=false; stopFlag=true; if(raf) cancelAnimationFrame(raf); },
    get running(){ return running; }
  };
}
window.createTicker=createTicker;

function initQuiz(q){

}
function nextSection(dir){
  const ids=SECTIONS.map(s=>s.id).filter(Boolean);

  if(ids[j]) location.hash='#'+ids[j];

/* ---------- 启动 ---------- */
function boot(hotData){
  loadState();
  if(hotData && hotData.quiz){
    Object.keys(hotData.quiz).forEach(function(k){ if(hotData.quiz[k]) State.quiz[k]=true; });
  }
  Theme.init();
  SECTIONS.push.apply(SECTIONS, $$('section.ch'));
  const hash=(location.hash||'').replace(/^#/,'');
  showSection(hash||'ch-00-start', false);

  $$('.nav-link').forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      location.hash='#'+a.dataset.ch;
    });
  });
  window.addEventListener('hashchange', function(){
    const id=(location.hash||'').replace(/^#/,'');
    if(id!==currentId) showSection(id||'ch-00-start', false);
  });

  $$('.quiz').forEach(initQuiz);
  refreshProgress();

  // 代码复制
  $$('.code-wrap').forEach(function(wrap){
    const btn=$('.code-btn', wrap), code=$('pre code', wrap);
    if(!btn||!code) return;
    btn.addEventListener('click', function(){
      const txt=code.textContent;
      function flash(ok){ btn.textContent=ok?'已复制':'选中后按 Ctrl+C'; setTimeout(function(){ btn.textContent='复制'; },1600); }
      function fallback(){
        try{
          const r=document.createRange(); r.selectNodeContents(code);
          const sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
          document.execCommand('copy'); flash(true);
        }catch(e){ flash(false); }
      }
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(function(){ flash(true); }, fallback);
      } else fallback();
    });
  });

  const navBtn=$('#navToggle'), side=$('#sidebar'), scrim=$('#scrim');
  function closeNav(){ if(side) side.classList.remove('is-open'); if(scrim) scrim.classList.remove('is-open'); if(navBtn) navBtn.setAttribute('aria-expanded','false'); }
  if(navBtn) navBtn.addEventListener('click', function(){
    const open=!side.classList.contains('is-open');
    side.classList.toggle('is-open', open);
    if(scrim) scrim.classList.toggle('is-open', open);
    navBtn.setAttribute('aria-expanded', String(open));
  });
  if(scrim) scrim.addEventListener('click', closeNav);
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape') closeNav();
    if(e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if(e.key==='ArrowRight'&&e.altKey) nextSection(1);
    if(e.key==='ArrowLeft'&&e.altKey) nextSection(-1);
  });

  const reset=$('#resetBtn');
  if(reset) reset.addEventListener('click', function(){
    State.quiz={}; State.chapters={};
    try{ localStorage.removeItem(STORE_KEY); }catch(e){}
    refreshProgress();
    $$('.opt').forEach(function(o){ o.disabled=false; o.classList.remove('is-ok','is-bad'); });
    $$('.quiz-fb').forEach(function(f){ f.textContent=''; f.classList.remove('bad'); });
    toast('进度已重置');
  });

  const cont=$('#continueBtn');
  if(cont) cont.addEventListener('click', function(e){
    e.preventDefault();
    const ids=SECTIONS.map(s=>s.id).filter(Boolean);
    const first=ids.find(function(id){ return !chapterDone(id); });
    location.hash='#'+(first||'ch-00-start');
  });

  // 主题变化时重绘
  Theme.on(function(){
    PLOTS.forEach(function(p){ try{ p._resize(); }catch(e){} });
  });
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(){ Theme.emit(); });

  // 键盘左右换章
  const hint=document.createElement('style');
  hint.textContent='@media (max-width:960px){.ch{max-width:none}}';
  document.head.appendChild(hint);
}

/* ---------- 导出 ---------- */
window.NN={
  MLP:MLP, ACTS:ACTS, softmax:softmax, sampleLoss:sampleLoss,
  Plot:Plot, fitCanvas:fitCanvas, drawMatrix:drawMatrix, drawNet:drawNet,
  renderBoundary:renderBoundary, barChart:barChart,
  mulberry32:mulberry32, randn:randn, clamp:clamp, lerp:lerp, fmt:fmt, token:token,
  mix:mix, rgba:rgba, hexToRgb:hexToRgb, TAU:TAU, shuffle:shuffle,
  toast:toast, createTicker:createTicker, initDemos:initDemos
};

const HOT = window.claude && window.claude.hot;
function launch(data){
  boot(data || null);
  if(HOT && typeof HOT.snapshot === 'function'){
    try{ HOT.snapshot(function(){ return { quiz: State.quiz, chapters: State.chapters }; }); }catch(e){}
  }
}
if(HOT && typeof HOT.ready === 'function'){
  try{ HOT.ready(launch); }catch(e){ launch(null); }
} else {
  launch(null);
}
})();
</script>
