<title>神经网络讲义</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="从单个神经元到 Transformer 的交互式神经网络课程,可以在浏览器里直接训练模型。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@500;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* ============================================================
   设计令牌 —— 蓝图讲义(浅) / 仪器面板(深)
   ============================================================ */
:root{
  color-scheme: light;
  --bg:#E9EEF4;
  --bg2:#DFE7EF;
  --surface:#FFFFFF;
  --surface2:#F3F7FB;
  --ink:#0E1A28;
  --ink2:#33475C;
  --muted:#68798C;
  --line:#CBD7E3;
  --line2:#A9BACB;
  --accent:#1F4FD1;
  --accent2:#C24A16;
  --accent-soft:#DCE6FF;
  --ok:#0F7A57;
  --warn:#8A5A00;
  --err:#B62E28;
  --code-bg:#0D1826;
  --code-fg:#DCE7F2;
  --code-dim:#7E94AA;
  --shadow:0 1px 2px rgba(14,26,40,.07),0 10px 28px -16px rgba(14,26,40,.28);
  --shadow-sm:0 1px 2px rgba(14,26,40,.08);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100;
  --seq-lo:#EAF2FC; --seq-mid:#6da7ec; --seq-hi:#0d366b;
  --hl:rgba(31,79,209,.10);
  --hl2:rgba(194,74,22,.10);

  --f-display:"Noto Serif SC", "Songti SC", Georgia, serif;
  --f-body:"Noto Sans SC", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "Cascadia Code", Consolas, monospace;

  --t-xs:.75rem; --t-sm:.82rem; --t-base:.95rem; --t-lg:1.06rem;
  --t-xl:1.28rem; --t-2xl:1.62rem; --t-3xl:2.1rem; --t-4xl:2.9rem;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:72px;
  --r1:6px; --r2:10px; --r3:16px;
  --nav-w:268px;
  --content-max:760px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#080E15;
    --bg2:#0B131C;
    --surface:#101A24;
    --surface2:#16222E;
    --ink:#E3EDF6;
    --ink2:#B3C5D6;
    --muted:#7E93A8;
    --line:#1E2C3A;
    --line2:#33475A;
    --accent:#7FA6FF;
    --accent2:#FF8A5B;
    --accent-soft:#152A4D;
    --ok:#3FC79A;
    --warn:#E0B04A;
    --err:#FF7B72;
    --code-bg:#0B141D;
    --code-fg:#D6E4F0;
    --code-dim:#6E8399;
    --shadow:0 1px 2px rgba(0,0,0,.45),0 14px 36px -18px rgba(0,0,0,.85);
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
    --seq-lo:#0D1C2B; --seq-mid:#2a78d6; --seq-hi:#86b6ef;
    --hl:rgba(127,166,255,.14);
    --hl2:rgba(255,138,91,.14);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#080E15;
  --bg2:#0B131C;
  --surface:#101A24;
  --surface2:#16222E;
  --ink:#E3EDF6;
  --ink2:#B3C5D6;
  --muted:#7E93A8;
  --line:#1E2C3A;
  --line2:#33475A;
  --accent:#7FA6FF;
  --accent2:#FF8A5B;
  --accent-soft:#152A4D;
  --ok:#3FC79A;
  --warn:#E0B04A;
  --err:#FF7B72;
  --code-bg:#0B141D;
  --code-fg:#D6E4F0;
  --code-dim:#6E8399;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 14px 36px -18px rgba(0,0,0,.85);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --seq-lo:#0D1C2B; --seq-mid:#2a78d6; --seq-hi:#86b6ef;
  --hl:rgba(127,166,255,.14);
  --hl2:rgba(255,138,91,.14);
}

/* ============================================================
   基础
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:var(--t-base);
  line-height:1.78;
  font-weight:400;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body::before{
  content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:60;background:var(--bg);
}
h1,h2,h3,h4{line-height:1.3;text-wrap:balance;margin:0}
p{margin:0 0 var(--s4)}
a{color:var(--accent);text-underline-offset:2px;text-decoration-thickness:1px}
a:hover{text-decoration-thickness:2px}
img,canvas,svg{max-width:100%}
canvas{display:block}
::selection{background:var(--accent-soft);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
[hidden]{display:none!important}

.app{
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-bottom:var(--s7);
}

/* ============================================================
   顶栏
   ============================================================ */
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  display:flex;align-items:center;gap:var(--s3);
  padding:10px 0;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid var(--line);
  margin-bottom:var(--s5);
}
@supports not (background: color-mix(in srgb, red 50%, blue)){
  .topbar{background:var(--bg)}
}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex-shrink:0}
.brand-mark{
  width:28px;height:28px;flex-shrink:0;color:var(--accent);
}
.brand-name{
  font-family:var(--f-display);font-weight:700;font-size:var(--t-lg);
  letter-spacing:.02em;white-space:nowrap;
}
.brand-sub{
  font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted);
  letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;
}
@media (max-width:860px){.brand-sub{display:none}}
.topbar-spacer{flex:1 1 auto;min-width:0}
.progress-wrap{display:flex;align-items:center;gap:10px;flex-shrink:0}
.progress-label{font-family:var(--f-mono);font-size:var(--t-xs);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.progress-track{
  width:120px;height:5px;border-radius:99px;background:var(--line);
  overflow:hidden;flex-shrink:0;
}
@media (max-width:520px){.progress-track{width:64px}}
.progress-fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .45s cubic-bezier(.2,.7,.2,1)}
.icon-btn{
  width:34px;height:34px;display:grid;place-items:center;flex-shrink:0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r1);
  color:var(--ink2);cursor:pointer;transition:background .15s,border-color .15s;
}
.icon-btn:hover{background:var(--surface2);border-color:var(--line2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
.nav-toggle{display:none}
@media (max-width:960px){
  .nav-toggle{display:grid}
  .progress-label{display:none}
}

/* ============================================================
   两栏骨架
   ============================================================ */
.shell{
  display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr);
  gap:var(--s6);align-items:start;
  max-width:1280px;margin:0 auto;
}
.sidebar{
  position:sticky;top:calc(env(safe-area-inset-top,0px) + 68px);
  max-height:calc(100dvh - 96px);overflow-y:auto;overscroll-behavior:contain;
  padding-right:4px;padding-bottom:var(--s5);
  scrollbar-width:thin;
}
.sidebar::-webkit-scrollbar{width:8px}
.sidebar::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:3px solid var(--bg)}
.scrim{display:none}
@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr);gap:0}
  .sidebar{
    position:fixed;inset:0 auto 0 0;z-index:70;width:min(320px,86vw);
    max-height:none;height:100%;
    background:var(--surface);border-right:1px solid var(--line);
    padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 24px);
    transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.7,.2,1);
    box-shadow:var(--shadow);
  }
  .sidebar.is-open{transform:none}
  .scrim{
    display:block;
    position:fixed;inset:0;z-index:65;background:rgba(6,12,20,.5);
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .scrim.is-open{opacity:1;pointer-events:auto}
}

/* 导航 */
.nav-head{
  font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);padding:0 10px;margin-bottom:var(--s2);
}
.nav-group{margin-bottom:var(--s5)}
.nav-link{
  display:flex;align-items:center;gap:10px;
  padding:7px 10px;border-radius:var(--r1);
  color:var(--ink2);text-decoration:none;font-size:var(--t-sm);
  line-height:1.45;transition:background .14s,color .14s;
  position:relative;
}
.nav-link:hover{background:var(--surface2);color:var(--ink);text-decoration:none}
.nav-link.is-active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.nav-num{
  font-family:var(--f-mono);font-size:11px;color:var(--muted);
  width:22px;flex-shrink:0;font-variant-numeric:tabular-nums;
}
.nav-link.is-active .nav-num{color:var(--accent)}
.nav-check{
  margin-left:auto;width:14px;height:14px;flex-shrink:0;color:var(--ok);
  opacity:0;transform:scale(.6);transition:opacity .2s,transform .2s;
}
.nav-link.is-done .nav-check{opacity:1;transform:none}
.nav-link.is-done .nav-title{color:var(--muted)}
.nav-link.is-active.is-done .nav-title{color:var(--accent)}
.nav-title{min-width:0}

.side-card{
  margin-top:var(--s4);padding:14px;border:1px solid var(--line);
  border-radius:var(--r2);background:var(--surface);
}
.side-card h4{font-size:var(--t-sm);font-weight:500;margin-bottom:6px}
.side-card p{font-size:var(--t-xs);color:var(--muted);line-height:1.6;margin:0 0 10px}
.mini-btn{
  font:inherit;font-size:var(--t-xs);padding:5px 10px;border-radius:var(--r1);
  background:var(--surface2);color:var(--ink2);border:1px solid var(--line);
  cursor:pointer;
}
.mini-btn:hover{color:var(--ink);border-color:var(--line2)}

/* ============================================================
   内容
   ============================================================ */
.content{min-width:0;padding-bottom:var(--s8)}
.ch{max-width:var(--content-max);margin:0 auto;scroll-margin-top:88px}
.ch.is-wide{max-width:none}
.ch-head{margin-bottom:var(--s6)}
.ch-eyebrow{
  display:flex;align-items:center;gap:10px;margin-bottom:var(--s3);
  font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);
}
.ch-eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.ch-title{
  font-family:var(--f-display);font-weight:700;
  font-size:clamp(1.75rem,4.2vw,2.6rem);line-height:1.22;
  letter-spacing:.01em;margin-bottom:var(--s3);
}
.ch-sub{font-size:var(--t-lg);color:var(--ink2);margin:0;max-width:56ch;line-height:1.7}
.ch-rule{height:1px;background:linear-gradient(90deg,var(--line2),transparent);margin-top:var(--s5)}
.prereq{
  display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;
  font-size:var(--t-sm);color:var(--muted);
  border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);
  padding:8px 0;margin:0 0 var(--s5);line-height:1.6;
}
.prereq b{color:var(--accent);font-weight:500;font-size:var(--t-xs);letter-spacing:.04em;white-space:nowrap;background:var(--accent-soft);padding:1px 8px;border-radius:3px}
.prereq span{max-width:100%}

h3{
  font-family:var(--f-body);font-weight:700;font-size:var(--t-xl);
  margin:var(--s7) 0 var(--s3);letter-spacing:.01em;
  display:flex;align-items:baseline;gap:10px;
}
h3 .h3-n{
  font-family:var(--f-mono);font-size:var(--t-xs);color:var(--accent);
  font-weight:500;letter-spacing:.08em;
}
h4{font-size:var(--t-lg);font-weight:700;margin:var(--s5) 0 var(--s2)}
.lead{font-size:var(--t-lg);color:var(--ink2);line-height:1.8}
.content p{max-width:68ch}
.content li{max-width:66ch}
strong{font-weight:700}
em{font-style:normal;background:linear-gradient(transparent 62%, var(--accent-soft) 0);padding:0 1px}
code{
  font-family:var(--f-mono);font-size:.88em;
  background:var(--surface2);border:1px solid var(--line);
  padding:1px 5px;border-radius:4px;color:var(--ink);
  white-space:nowrap;
}
a code{color:inherit}

ul.list,ol.list{margin:0 0 var(--s4);padding-left:1.3em}
ul.list li,ol.list li{margin-bottom:8px;padding-left:4px}
ul.list li::marker{color:var(--accent)}
ol.list li::marker{color:var(--accent);font-family:var(--f-mono);font-size:.85em}

.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4);margin:var(--s4) 0}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3);margin:var(--s4) 0}
@media (max-width:760px){.grid-2,.grid-3{grid-template-columns:minmax(0,1fr)}}
.grid-2>*,.grid-3>*{min-width:0}

.card{
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r2);padding:var(--s4) var(--s5);
  box-shadow:var(--shadow-sm);min-width:0;
}
.card p:last-child,.card ul:last-child{margin-bottom:0}
.card-h{
  font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-bottom:var(--s2);
}

.callout{
  border-left:3px solid var(--accent);background:var(--surface);
  border-radius:0 var(--r1) var(--r1) 0;padding:var(--s3) var(--s4);
  margin:var(--s4) 0;font-size:var(--t-base);
}
.callout p:last-child{margin-bottom:0}
.callout b:first-child{display:block;font-size:var(--t-sm);letter-spacing:.02em;margin-bottom:2px}
.callout.tip{border-left-color:var(--ok)}
.callout.tip b:first-child{color:var(--ok)}
.callout.warn{border-left-color:var(--warn);background:color-mix(in srgb,var(--warn) 6%,var(--surface))}
.callout.warn b:first-child{color:var(--warn)}
.callout.key{border-left-color:var(--accent2);background:var(--surface)}
.callout.key b:first-child{color:var(--accent2)}
@supports not (background:color-mix(in srgb, red 50%, blue)){.callout.warn{background:var(--surface2)}}

.math{
  font-family:var(--f-mono);font-size:.95rem;line-height:2;
  background:var(--surface2);border:1px solid var(--line);
  border-radius:var(--r1);padding:12px 16px;margin:var(--s4) 0;
  overflow-x:auto;text-align:center;color:var(--ink);
}
.math var{font-style:italic;color:var(--accent);font-family:var(--f-display)}
.math sub{font-size:.75em}
.math-note{text-align:left;font-family:var(--f-body);font-size:var(--t-sm);color:var(--muted);line-height:1.6}

/* 代码 */
.code-wrap{margin:var(--s4) 0;border-radius:var(--r2);overflow:hidden;border:1px solid var(--line)}
.code-bar{
  display:flex;align-items:center;gap:8px;padding:7px 12px;
  background:color-mix(in srgb,var(--code-bg) 92%, #ffffff 8%);
  border-bottom:1px solid rgba(255,255,255,.08);
  font-family:var(--f-mono);font-size:var(--t-xs);color:var(--code-dim);
}
.code-bar .sp{flex:1}
.code-btn{
  font:inherit;font-size:var(--t-xs);background:none;border:1px solid rgba(255,255,255,.16);
  color:var(--code-dim);border-radius:4px;padding:2px 8px;cursor:pointer;
}
.code-btn:hover{color:var(--code-fg);border-color:rgba(255,255,255,.4)}
pre.code{
  margin:0;padding:14px 16px;overflow-x:auto;
  background:var(--code-bg);color:var(--code-fg);
  font-family:var(--f-mono);font-size:.82rem;line-height:1.7;
  font-variant-ligatures:none;
}
pre.code code{background:none;border:0;padding:0;color:inherit;white-space:pre;font-size:inherit}
pre.code .c{color:var(--code-dim);font-style:italic}
pre.code .k{color:#8FB3FF}
pre.code .s{color:#9AD8A8}
pre.code .n{color:#F0B37E}
pre.code .f{color:#E7C6FF}

/* 演示面板 */
.demo{
  margin:var(--s5) 0;border:1px solid var(--line);border-radius:var(--r2);
  background:var(--surface);box-shadow:var(--shadow-sm);overflow:hidden;
}
.demo-bar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 14px;background:var(--surface2);
  border-bottom:1px solid var(--line);
  font-family:var(--f-mono);font-size:var(--t-xs);letter-spacing:.06em;
  color:var(--ink2);
}
.demo-bar .live{
  display:inline-flex;align-items:center;gap:6px;
  color:var(--accent);font-weight:500;
}
.demo-bar .live::before{
  content:"";width:6px;height:6px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 3px var(--hl);animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.demo-bar .sp{flex:1 1 auto}
.demo-body{padding:var(--s4);min-width:0}
.demo-hint{
  font-size:var(--t-xs);color:var(--muted);line-height:1.6;
  padding:8px 14px;border-top:1px dashed var(--line);background:var(--surface2);
}
.demo-hint:empty{display:none}

.controls{
  display:flex;flex-wrap:wrap;gap:var(--s3) var(--s4);align-items:flex-end;
  margin-top:var(--s3);
}
.ctl{display:flex;flex-direction:column;gap:4px;min-width:130px;flex:1 1 130px;max-width:240px}
.ctl > label{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;
  color:var(--muted);display:flex;justify-content:space-between;gap:8px;
}
.ctl output{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:20px;background:none;cursor:pointer;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line);border-radius:99px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:15px;height:15px;border-radius:50%;
  background:var(--accent);border:2px solid var(--surface);margin-top:-5.5px;
  box-shadow:0 0 0 1px var(--accent);
}
input[type=range]::-moz-range-track{height:4px;background:var(--line);border-radius:99px}
input[type=range]::-moz-range-thumb{
  width:13px;height:13px;border-radius:50%;background:var(--accent);
  border:2px solid var(--surface);box-shadow:0 0 0 1px var(--accent);
}
input[type=range]:disabled{opacity:.45;cursor:not-allowed}

.btn{
  font:inherit;font-size:var(--t-sm);font-weight:500;
  padding:7px 15px;border-radius:var(--r1);
  background:var(--surface);color:var(--ink2);border:1px solid var(--line2);
  cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .06s;
  white-space:nowrap;
}
.btn:hover{background:var(--surface2);color:var(--ink);border-color:var(--ink2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#08101a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#08101a}}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
:root[data-theme="dark"] .btn.primary:hover{color:#08101a}
